apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: url-shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          image: DOCKERHUB_USERNAME/url-shortener-analytics:0.1.0
          ports:
            - containerPort: 8080
          env:
            # analytics_app can only access the analytics db (db/init.sh)
            # password can't contain @ : / ? (use openssl rand -hex 16)
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-db
                  key: password
            - name: DATABASE_URL
              value: postgres://analytics_app:$(DB_PASSWORD)@postgres:5432/analytics
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
---
# internal only, just the shortener calls it
apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: url-shortener
spec:
  selector:
    app: analytics
  ports:
    - port: 8080
      targetPort: 8080
