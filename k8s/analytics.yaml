apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: url-shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          image: DOCKERHUB_USERNAME/url-shortener-analytics:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            # password can't contain @ : / ?
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/analytics
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
---
# internal only, just the shortener calls it
apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: url-shortener
spec:
  selector:
    app: analytics
  ports:
    - port: 8080
      targetPort: 8080
