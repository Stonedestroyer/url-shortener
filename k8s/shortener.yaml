apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener
  namespace: url-shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shortener
  template:
    metadata:
      labels:
        app: shortener
    spec:
      containers:
        - name: shortener
          image: DOCKERHUB_USERNAME/url-shortener-shortener:0.1.0
          ports:
            - containerPort: 8080
          env:
            # links_app can only access the links db (db/init.sh)
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shortener-db
                  key: password
            - name: DATABASE_URL
              value: postgres://links_app:$(DB_PASSWORD)@postgres:5432/links
            - name: ANALYTICS_URL
              value: http://analytics:8080
            - name: PUBLIC_BASE_URL
              value: http://localhost:8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
# LoadBalancer, shows up on localhost:8080 in Docker Desktop
apiVersion: v1
kind: Service
metadata:
  name: shortener
  namespace: url-shortener
spec:
  type: LoadBalancer
  selector:
    app: shortener
  ports:
    - port: 8080
      targetPort: 8080
