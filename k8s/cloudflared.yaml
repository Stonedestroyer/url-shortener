# Cloudflare quick tunnel for public HTTPS (no account needed).
# URL changes on restart: kubectl -n url-shortener logs deploy/cloudflared | grep trycloudflare.com
# Keep at 1 replica, each replica gets its own URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: url-shortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.8.1
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - --url
            - http://shortener:8080
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
